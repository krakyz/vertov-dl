<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card scenarios</title><link rel="stylesheet" href="/src/style.css"><body style="padding:24px"><div style="max-width:700px;margin:auto"><h1>Проверка карточек</h1><div id="qa-controls"><button id="snapshot">Повторный снимок</button> · <button id="metadata">Метаданные</button> · <button id="reset">Сброс</button> · <button id="complete">Завершить</button> · <button id="fail">Ошибка</button></div><div class="results" id="qa-results"></div><output id="qa-state"></output><pre id="qa-audit"></pre></div>  <template id="card-template"><article class="media-card"><div class="media-info"><button class="thumbnail" type="button" disabled aria-label="Открыть превью"><img class="thumbnail-image" alt="" hidden><span class="thumbnail-fallback">↓</span><span class="media-card-badges" hidden><img class="media-download-icon" alt=""><span class="media-download-label"></span></span><span class="duration library-duration" hidden></span></button><div class="media-details"><div class="media-heading"><h2 class="media-title"><span class="media-name"></span><span class="media-author"></span></h2></div></div><div class="download-status-container"><p class="download-status" role="status" hidden><span class="download-status-label"><span class="download-status-text"></span><svg class="status-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path class="clock-hour" d="M12 12V7"/><path class="clock-minute" d="M12 12V5"/></svg><svg class="status-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m4 12 5 5L20 6"/></svg></span><span class="status-progress"><span class="card-progress" role="progressbar" aria-label="Прогресс задачи" aria-valuemin="0" aria-valuemax="100"><span class="card-progress-fill"></span></span><span class="status-progress-value" aria-hidden="true"></span></span></p></div></div><div class="download-actions"><button class="download-audio" type="button">Скачать аудио</button><button class="download-video" type="button">Скачать видео</button></div><div class="card-options" hidden><label>Формат из yt-dlp<select class="format-choice"><option value="">По пресету качества</option></select></label><p class="exact-note muted" hidden>Сервер поддерживает только пресеты.</p><p class="muted">Выбранный видеопоток сохраняется в MP4 и может быть без звука.</p><button class="refresh-data inline-action" type="button">Обновить данные</button></div><div class="job-output"></div></article></template><script type="module">
import {MediaCard} from '/src/view.ts';
const probe={id:'qa-probe',kind:'probe',state:'completed',title:'Тестовое видео',message:'',created:1,updated:1,preset:'best',error_code:null,sha256:null,progress:null,details:{title:'Тестовое видео',uploader:'Тестовый автор',duration:136,formats:[{id:'22',ext:'mp4',height:720,vcodec:'h264',acodec:'aac'}]}};
let entry={url:'https://example.org/test',probeId:probe.id,pending:false}, download;
let cards=[];
function paint(){cards.forEach(c=>c.update(entry,probe,download,{advanced:false,exact:true,authenticated:true,preferred:'video',quality:'best',dispatched:true}));document.querySelector('#qa-state').textContent=download?.state||'ready';}
function start(kind){entry.sending=true;entry.sendingKind=kind;paint();setTimeout(()=>{entry.sending=false;download={...probe,id:'qa-download',kind:'download',preset:kind==='audio'?'audio':'best',state:'downloading',progress:{downloaded:20,total:100,speed:10,eta:8}};paint()},400)}
for(let i=0;i<2;i++){const c=new MediaCard({download:start,cancel:()=>{if(download) download.state='cancelled';else probe.state='cancelled';paint()},retry:()=>{download.state='downloading';paint()},refresh:()=>{}});cards.push(c);document.querySelector('#qa-results').append(c.root)}
document.querySelector('#snapshot').onclick=()=>{const changes=[];const observer=new MutationObserver(items=>changes.push(...items));cards.forEach(c=>observer.observe(c.root,{subtree:true,attributes:true,childList:true,characterData:true}));paint();queueMicrotask(()=>{observer.disconnect();document.querySelector('#qa-state').textContent=`Повторный снимок: ${changes.length} изменений DOM`})};
document.querySelector('#metadata').onclick=()=>{download=undefined;probe.state='probing';entry.sending=false;paint()};
document.querySelector('#reset').onclick=()=>{download=undefined;probe.state='completed';entry.sending=false;paint()};document.querySelector('#complete').onclick=()=>{if(download){download.state='completed';paint()}};document.querySelector('#fail').onclick=()=>{if(download){download.state='failed';paint()}};paint();
let auditVersion=0;
function audit(){const version=++auditVersion;const frames=[];const start=performance.now();function frame(){if(version!==auditVersion)return;frames.push([...document.querySelectorAll('.media-card')].map(el=>{const panel=el.querySelector('.download-actions').getBoundingClientRect();const path=el.querySelector('.media-card-contour');return {width:panel.width,height:panel.height,valid:Number.isFinite(path.getTotalLength()),icon:[...el.querySelectorAll('.cancel-action')].every(b=>getComputedStyle(b,'::before').content==='none'),stroke:getComputedStyle(el.querySelector('.media-card-stroke')).stroke};}));if(performance.now()-start<800)requestAnimationFrame(frame);else document.querySelector('#qa-audit').textContent=JSON.stringify({frames:frames.length,valid:frames.flat().every(f=>f.valid&&f.icon&&f.width>=0&&f.height>=0),minWidth:Math.min(...frames.flat().map(f=>f.width)),maxWidth:Math.max(...frames.flat().map(f=>f.width))});}requestAnimationFrame(frame)}
document.addEventListener('click',audit);document.querySelectorAll('.media-card').forEach(el=>{el.addEventListener('pointerenter',audit);el.addEventListener('pointerleave',audit)});
</script>
