[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vertov-dl"
version = "0.1.0a1"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3", "yt-dlp[default]==2026.10.26", "pycryptodomex==3.24.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
