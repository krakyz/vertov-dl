name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check apps/api tests scripts/ffmpeg-local.py
      - run: ruff format --check apps/api tests scripts/ffmpeg-local.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pytest -q
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker build -t vertov-dl:ci .
      - run: python scripts/check-image.py vertov-dl:ci
